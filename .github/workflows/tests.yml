name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 用系统自带的解释器，和 bin/ticket、bin/ticketd 默认用的一致：ubuntu-latest 上是较新的 3.x，macOS 上是 3.9
      - name: Python
        run: /usr/bin/python3 --version
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Card variants render
        run: /usr/bin/python3 scripts/validate_cards.py --dump > /dev/null

  windows:
    name: native Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 真调 Windows 接口的用例（作业对象、进程、文件真实路径、联接点、文件锁、收汇报）+ mock 的平台分支
      - name: Windows unit tests
        run: python -m unittest discover -s tests -p "test_windows.py" -v
      - name: Stand-ins for claude and lark-cli
        # 只验证服务能装、能起、能停；不跑 worker，也不发消息
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'fakebin'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item (Get-Command cmd.exe).Source (Join-Path $d 'claude.exe')
          Copy-Item (Get-Command cmd.exe).Source (Join-Path $d 'lark-cli.exe')
          Add-Content $env:GITHUB_PATH $d
      - name: Install
        run: |
          New-Item -ItemType Directory -Force (Join-Path $HOME '.ticketd') | Out-Null
          Set-Content -Path (Join-Path $HOME '.ticketd\config.env') -Value 'TICKETD_OWNER=ou_owner'
          $env:TICKETD_PYTHON = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File scripts\windows\install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Service is running
        run: |
          $hb = Join-Path $HOME '.ticketd\heartbeat'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $hb); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $hb)) { exit 1 }
          if (-not (Select-String -Path (Join-Path $HOME '.ticketd\logs\daemon.out.log') -Pattern 'ticketd started' -Quiet)) { exit 1 }
          $env:TICKETD_PYTHON = (Get-Command python).Source
          bin\ticket.cmd ls
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m ticketd.winsvc status
      - name: Reinstall restarts the service
        run: |
          $env:TICKETD_PYTHON = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File scripts\windows\install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $n = (Select-String -Path (Join-Path $HOME '.ticketd\logs\daemon.out.log') -Pattern 'ticketd stopped').Count
          if ($n -ne 1) { Write-Error "ticketd stopped x$n"; exit 1 }
      - name: Uninstall
        run: |
          $env:TICKETD_PYTHON = (Get-Command python).Source
          powershell -ExecutionPolicy Bypass -File scripts\windows\uninstall.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $s = python -m ticketd.winsvc status
          if ($s -ne 'supervisor=stopped daemon=stopped') { Write-Error $s; exit 1 }
          schtasks /Query /TN dev.larkyard.ticketd 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error 'task still registered'; exit 1 }
          if (-not (Test-Path (Join-Path $HOME '.ticketd\config.env'))) { exit 1 }
          exit 0  # 上面 schtasks /Query 按预期返回 1；pwsh 会拿最后一条命令的退出码当这一步的结果
      - name: Logs
        if: failure()
        run: |
          Get-ChildItem (Join-Path $HOME '.ticketd\logs') -ErrorAction SilentlyContinue | ForEach-Object { "== $_"; Get-Content $_.FullName -Tail 50 }
          schtasks /Query /V /FO LIST /TN dev.larkyard.ticketd 2>$null

  telemetry-worker:
    name: telemetry backend (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker unit tests
        working-directory: server/telemetry
        run: npm test

  systemd-user-service:
    name: systemd user service (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start a systemd user instance
        run: |
          sudo loginctl enable-linger "$USER"
          rt="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$rt" >> "$GITHUB_ENV"
          for i in $(seq 30); do
            if [ -S "$rt/systemd/private" ] || [ -S "$rt/bus" ]; then break; fi
            sleep 1
          done
          XDG_RUNTIME_DIR="$rt" systemctl --user show-environment > /dev/null
      - name: Stand-ins for claude and lark-cli
        # 只验证服务能装、能起、能停；这一步不跑 worker，也不发消息
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          for t in claude lark-cli; do
            printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fakebin/$t"
            chmod +x "$RUNNER_TEMP/fakebin/$t"
          done
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          mkdir -p ~/.ticketd
          echo "TICKETD_OWNER=ou_owner" > ~/.ticketd/config.env
          scripts/install.sh
      - name: Service is running
        run: |
          systemctl --user is-active dev.larkyard.ticketd
          for i in $(seq 30); do [ -f ~/.ticketd/heartbeat ] && break; sleep 1; done
          test -f ~/.ticketd/heartbeat
          grep -q "ticketd started" ~/.ticketd/logs/daemon.out.log
          bin/ticket ls
      - name: Reinstall restarts the service
        run: |
          scripts/install.sh
          systemctl --user is-active dev.larkyard.ticketd
          test "$(grep -c 'ticketd stopped' ~/.ticketd/logs/daemon.out.log)" = 1
      - name: Uninstall
        run: |
          scripts/uninstall.sh
          if systemctl --user is-active --quiet dev.larkyard.ticketd; then exit 1; fi
          test ! -e ~/.config/systemd/user/dev.larkyard.ticketd.service
          test -f ~/.ticketd/config.env
      - name: Logs
        if: failure()
        run: |
          systemctl --user status dev.larkyard.ticketd --no-pager || true
          journalctl --user -u dev.larkyard.ticketd --no-pager || true
          tail -n 50 ~/.ticketd/logs/* || true
